name: Einspeisung aktualisieren

# Zwei Auslöser, damit die Seite dauerhaft aktuell bleibt:
#  1. Kette: Jeder Lauf wartet am Ende gut 13 Minuten und startet den nächsten selbst (Job "weiter").
#     Das geht ohne Zutun, auch wenn der GitHub-Zeitplan ausfällt (bei diesem Repository lief er anfangs gar nicht).
#  2. Zeitplan als Reserve, falls die Kette einmal abreißt. Nicht auf :00/:15/:30/:45 legen: Dort ist GitHub überlastet.
# Anhalten: "gh workflow disable update.yml" (dann endet auch die Kette).
on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: einspeisung
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Der verschlüsselte Anmeldezustand für die Live-Werte liegt im Zweig "state".
      - name: Gespeicherten Anmeldezustand holen
        run: |
          mkdir -p state
          if git fetch -q --depth=1 origin state 2>/dev/null; then
            git show FETCH_HEAD:tokenstate.enc.json > state/tokenstate.enc.json || rm -f state/tokenstate.enc.json
          fi
          if [ -f state/tokenstate.enc.json ]; then sha256sum state/tokenstate.enc.json | cut -d' ' -f1 > state/.before; fi

      - name: Werte aus dem Westnetz-Portal holen und verschlüsseln
        env:
          MEDACO_USER: ${{ secrets.MEDACO_USER }}
          MEDACO_PASSWORD: ${{ secrets.MEDACO_PASSWORD }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          SONNEN_SEED: ${{ secrets.SONNEN_SEED }}
        run: node scripts/update.js

      # Auch sichern, wenn der Abruf danach scheitert: sonnen tauscht den Erneuerungsschlüssel bei jeder Erneuerung aus.
      - name: Anmeldezustand sichern
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=state/tokenstate.enc.json
          [ -f "$f" ] || exit 0
          after=$(sha256sum "$f" | cut -d' ' -f1)
          before=$(cat state/.before 2>/dev/null || true)
          [ "$after" != "$before" ] || exit 0
          d=$(mktemp -d); cp "$f" "$d/"; cd "$d"
          git init -q -b state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tokenstate.enc.json
          git commit -q -m "Zustand"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state
          echo "Anmeldezustand gesichert"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub schaltet geplante Läufe in öffentlichen Repositories nach 60 Tagen ohne Aktivität ab.
      - name: Repository aktiv halten
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt $((40 * 86400)) ]; then
            date -u +%F > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "Keepalive"
            git push
          fi

  # Wartet und stößt den nächsten Lauf an, auch wenn der Abruf oben gescheitert ist.
  weiter:
    needs: update
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Warten und nächsten Lauf starten
        run: |
          sleep 780
          # Läuft schon ein neuerer Lauf (z. B. vom Zeitplan), führt dieser die Kette fort. So entsteht nie eine zweite Kette.
          newer=$(gh run list --workflow update.yml --limit 30 --json databaseId,status             --jq "[.[] | select(.databaseId > ${GITHUB_RUN_ID}) | select(.status != \"completed\")] | length")
          if [ "${newer:-0}" -gt 0 ]; then echo "Ein neuerer Lauf ist schon unterwegs."; exit 0; fi
          for i in 1 2 3 4; do
            if gh workflow run update.yml; then echo "Nächster Lauf gestartet."; exit 0; fi
            sleep 30
          done
          echo "::error::Nächster Lauf konnte nicht gestartet werden, der Zeitplan springt als Reserve ein."
          exit 1
